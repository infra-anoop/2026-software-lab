# Ops runtime: Infisical→Railway sync / full bootstrap via annotated git tags.
#
# Preferred agent path (Codespace): push sync/**, bootstrap/** or db/** tags
#   nix develop -c uv run scripts/ops_runtime_tag.py sync --app-id <id> --environment production --push
# Break-glass: workflow_dispatch on sync-runtime-secrets / provision-runtime /
# verify-runtime-bootstrap (UI). Do not fold into v* ship/deploy.
#
# Tag shapes (strict): sync|bootstrap|db/<app_id>/<environment>
# environment ∈ {production, staging}; sync/bootstrap need a deploy.enabled app;
# db needs deploy/db/<app_id>.yml declaring that environment (no Railway, no sync).
#
# Lifecycle: bootstrap = A26 provision → database login (when deploy/db/<app>.yml
# exists) → A23 sync → A24 verify; rotate = sync only; database login / password
# rotation = db only (scripts/db_bootstrap.py; reads Infisical, never writes it);
# code deploy = v* (unchanged).

name: Ops runtime

on:
  push:
    tags:
      - 'sync/**'
      - 'bootstrap/**'
      - 'db/**'

permissions:
  contents: read
  id-token: write

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Parse and validate ops tag
        id: tag
        run: >
          uv run scripts/ops_runtime_tag.py parse
          --ref-name "${{ github.ref_name }}"
          --github-output

      - name: Select Railway token (workspace preferred)
        if: ${{ steps.tag.outputs.kind != 'db' }}
        run: |
          if [ -n "${{ secrets.RAILWAY_WORKSPACE_TOKEN }}" ]; then
            echo "RAILWAY_TOKEN_EFFECTIVE=${{ secrets.RAILWAY_WORKSPACE_TOKEN }}" >> "$GITHUB_ENV"
            echo "Using RAILWAY_WORKSPACE_TOKEN"
          elif [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "RAILWAY_TOKEN_EFFECTIVE=${{ secrets.RAILWAY_TOKEN }}" >> "$GITHUB_ENV"
            echo "Using RAILWAY_TOKEN"
          else
            echo "❌ No Railway token found. Set secrets.RAILWAY_WORKSPACE_TOKEN (preferred) or secrets.RAILWAY_TOKEN."
            exit 1
          fi

      - name: Infisical auth (OIDC preferred)
        # Read-only Infisical token for sync apply and the database login step.
        env:
          INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
        run: |
          set -euo pipefail
          if [ -n "${INFISICAL_MACHINE_IDENTITY_ID:-}" ]; then
            TOKEN=$(uv run scripts/infisical_oidc_login.py)
            echo "::add-mask::$TOKEN"
            echo "INFISICAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "Using Infisical OIDC (machine identity)"
          elif [ -n "${{ secrets.INFISICAL_TOKEN }}" ]; then
            echo "⚠️ Non-preferred: using secrets.INFISICAL_TOKEN (prefer OIDC + vars.INFISICAL_MACHINE_IDENTITY_ID)"
            echo "INFISICAL_TOKEN=${{ secrets.INFISICAL_TOKEN }}" >> "$GITHUB_ENV"
          else
            echo "❌ configure Infisical machine identity id (vars.INFISICAL_MACHINE_IDENTITY_ID)"
            echo "   or set non-preferred secrets.INFISICAL_TOKEN for local-style apply"
            exit 1
          fi

      - name: Provision (apply) — bootstrap only
        if: ${{ steps.tag.outputs.kind == 'bootstrap' }}
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN_EFFECTIVE }}
        run: >
          uv run scripts/provision_runtime.py
          --app-id "${{ steps.tag.outputs.app_id }}"
          --environment "${{ steps.tag.outputs.environment }}"
          --apply

      - name: Database login (ensure) — db, or bootstrap with deploy/db/<app>.yml
        if: ${{ steps.tag.outputs.kind == 'db' || steps.tag.outputs.db_bootstrap == 'true' }}
        env:
          INFISICAL_TOKEN: ${{ env.INFISICAL_TOKEN }}
        run: >
          uv run scripts/db_bootstrap.py ensure
          --app-id "${{ steps.tag.outputs.app_id }}"
          --environment "${{ steps.tag.outputs.environment }}"

      - name: Sync (apply)
        if: ${{ steps.tag.outputs.kind != 'db' }}
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN_EFFECTIVE }}
          INFISICAL_TOKEN: ${{ env.INFISICAL_TOKEN }}
        run: >
          uv run scripts/sync_runtime_secrets.py
          --app-id "${{ steps.tag.outputs.app_id }}"
          --environment "${{ steps.tag.outputs.environment }}"
          --target railway
          --apply

      - name: Verify bootstrap (live) — bootstrap only
        if: ${{ steps.tag.outputs.kind == 'bootstrap' }}
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN_EFFECTIVE }}
        run: >
          uv run scripts/verify_runtime_bootstrap.py
          --app-id "${{ steps.tag.outputs.app_id }}"
          --environment "${{ steps.tag.outputs.environment }}"
