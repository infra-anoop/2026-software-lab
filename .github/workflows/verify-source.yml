# ------------------------------------------------------------------------------
# Reusable: Verify Source (Nix)
# ------------------------------------------------------------------------------
# Validates that the repo builds and passes all Nix checks. Does not publish.
# NOT auto-triggered. Call via: ci-cd-pipeline.yml
# ------------------------------------------------------------------------------

name: "Verify Source (Nix)"

on:
  workflow_call:
  workflow_dispatch:  # Manual run only; no auto-trigger

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Ephemeral Postgres for A22 DDL apply tests (no Supabase account).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Validate app registry
        run: uv run scripts/validate_app_registry.py --check-json

      - name: Validate deploy env checklists
        run: uv run scripts/validate_deploy_env.py

      - name: Validate secrets schema
        run: uv run scripts/validate_secrets_schema.py

      - name: Supabase DDL dry-run (smart-writer)
        run: uv run scripts/apply_supabase_ddl.py --app smart-writer --dry-run

      - name: Supabase DDL dry-run (research-auditor)
        run: uv run scripts/apply_supabase_ddl.py --app research-auditor --dry-run

      - name: Script unit + DDL apply tests
        # PEP 723 on CLIs is not enough for pytest; inject test/runtime deps here.
        run: >
          uv run --with pytest --with 'psycopg[binary]>=3.2' --with 'pyyaml>=6' --with 'httpx>=0.27'
          pytest scripts/ -v

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            sandbox = false

      - name: Nix flake check
        run: nix flake check

      - name: Build container derivation
        run: nix build .#container

      - name: Offline boot smoke (default image)
        run: |
          set -euo pipefail
          LOAD_OUT=$(docker load < result)
          echo "$LOAD_OUT"
          IMAGE=$(echo "$LOAD_OUT" | awk '/Loaded image:/{print $3; exit}')
          if [ -z "$IMAGE" ]; then
            echo "Failed to parse image name from docker load"
            exit 1
          fi
          echo "Loaded $IMAGE"
          CMD=$(docker inspect --format '{{json .Config.Cmd}}' "$IMAGE")
          echo "Cmd: $CMD"
          echo "$CMD" | grep -q 'uv sync' && { echo "FAIL: Cmd still runs uv sync"; exit 1; }
          echo "$CMD" | grep -q uvicorn || { echo "FAIL: Cmd does not invoke uvicorn"; exit 1; }

          CID=$(docker run -d --network none -e PORT=8080 "$IMAGE")
          cleanup() { docker rm -f "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ok=0
          for i in $(seq 1 30); do
            if docker exec "$CID" /app/.venv/bin/python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health").read()' 2>/dev/null; then
              echo "health ok"
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "FAIL: /health did not succeed with --network none"
            docker logs "$CID" || true
            exit 1
          fi

      - name: Reclaim Nix/Docker disk
        if: always()
        run: uv run scripts/disk_hygiene.py --apply
