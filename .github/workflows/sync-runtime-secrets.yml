# Sync vault secrets → Railway runtime (install / rotate).
#
# Conscious bootstrap/rotate only — workflow_dispatch (or local CLI).
# Not on push, PR, or v* ship. Provision footprint = A26; verify = A24.
#
# Auth:
#   Railway: RAILWAY_WORKSPACE_TOKEN (preferred) or RAILWAY_TOKEN
#   Infisical: GitHub OIDC → short-lived token (vars.INFISICAL_MACHINE_IDENTITY_ID)
#              non-preferred fallback: secrets.INFISICAL_TOKEN
# Do not use Infisical secrets-action to dump values into GITHUB_ENV — A21 CLI
# fetches by deploy/secrets/schema.yaml vault_ref map.

name: Sync runtime secrets

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Application id (secrets schema + deploy.enabled)"
        required: true
        type: string
      environment:
        description: "Schema + deploy/railway/<environment>/"
        required: false
        type: choice
        options: [production, staging]
        default: production
      dry_run:
        description: "If true, print secret names only (no vault/Railway I/O)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync (dry-run)
        if: ${{ inputs.dry_run == true }}
        run: >
          uv run scripts/sync_runtime_secrets.py
          --app-id "${{ inputs.app_id }}"
          --environment "${{ inputs.environment }}"
          --target railway
          --dry-run

      - name: Select Railway token (workspace preferred)
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -n "${{ secrets.RAILWAY_WORKSPACE_TOKEN }}" ]; then
            echo "RAILWAY_TOKEN_EFFECTIVE=${{ secrets.RAILWAY_WORKSPACE_TOKEN }}" >> "$GITHUB_ENV"
            echo "Using RAILWAY_WORKSPACE_TOKEN"
          elif [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "RAILWAY_TOKEN_EFFECTIVE=${{ secrets.RAILWAY_TOKEN }}" >> "$GITHUB_ENV"
            echo "Using RAILWAY_TOKEN"
          else
            echo "❌ No Railway token found. Set secrets.RAILWAY_WORKSPACE_TOKEN (preferred) or secrets.RAILWAY_TOKEN."
            exit 1
          fi

      - name: Infisical auth (OIDC preferred)
        if: ${{ inputs.dry_run != true }}
        env:
          INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
        run: |
          set -euo pipefail
          if [ -n "${INFISICAL_MACHINE_IDENTITY_ID:-}" ]; then
            TOKEN=$(uv run scripts/infisical_oidc_login.py)
            echo "::add-mask::$TOKEN"
            echo "INFISICAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "Using Infisical OIDC (machine identity)"
          elif [ -n "${{ secrets.INFISICAL_TOKEN }}" ]; then
            echo "⚠️ Non-preferred: using secrets.INFISICAL_TOKEN (prefer OIDC + vars.INFISICAL_MACHINE_IDENTITY_ID)"
            echo "INFISICAL_TOKEN=${{ secrets.INFISICAL_TOKEN }}" >> "$GITHUB_ENV"
          else
            echo "❌ configure Infisical machine identity id (vars.INFISICAL_MACHINE_IDENTITY_ID)"
            echo "   or set non-preferred secrets.INFISICAL_TOKEN for local-style apply"
            exit 1
          fi

      - name: Sync (apply)
        if: ${{ inputs.dry_run != true }}
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN_EFFECTIVE }}
          INFISICAL_TOKEN: ${{ env.INFISICAL_TOKEN }}
        run: >
          uv run scripts/sync_runtime_secrets.py
          --app-id "${{ inputs.app_id }}"
          --environment "${{ inputs.environment }}"
          --target railway
          --apply
