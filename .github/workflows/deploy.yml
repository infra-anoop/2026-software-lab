name: Deploy to Railway

# Pins the Railway service to the GHCR image digest shipped by CI, applies
# runtime.start_command from deploy/railway/<environment>/<app_id>.yml, then
# deploys and waits for that new deployment to go terminal.
# Railway is a runtime only — it must not build from git/Railpack.

on:
  workflow_call:
    inputs:
      app_id:
        description: "Application id — selects deploy/railway/<environment>/<app_id>.yml"
        required: true
        type: string
      tag:
        description: "GHCR tag to resolve to a digest (default: latest)"
        required: false
        type: string
        default: latest
      environment:
        description: "Config folder under deploy/railway/ (production/staging)"
        required: false
        type: string
        default: production

  workflow_dispatch:
    inputs:
      app_id:
        description: "Application id (see apps/registry.json)"
        required: true
        type: string
      tag:
        description: "GHCR tag to resolve to a digest (default: latest)"
        required: false
        type: string
        default: latest
      environment:
        description: "Config folder under deploy/railway/"
        required: false
        type: choice
        options: [production, staging]
        default: production

concurrency:
  group: railway-deploy-${{ github.ref }}-${{ inputs.environment || 'production' }}-${{ inputs.app_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq + yq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Select Railway token (workspace preferred)
        run: |
          if [ -n "${{ secrets.RAILWAY_WORKSPACE_TOKEN }}" ]; then
            echo "RAILWAY_TOKEN_EFFECTIVE=${{ secrets.RAILWAY_WORKSPACE_TOKEN }}" >> "$GITHUB_ENV"
            echo "Using RAILWAY_WORKSPACE_TOKEN"
          elif [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "RAILWAY_TOKEN_EFFECTIVE=${{ secrets.RAILWAY_TOKEN }}" >> "$GITHUB_ENV"
            echo "Using RAILWAY_TOKEN"
          else
            echo "❌ No Railway token found. Set secrets.RAILWAY_WORKSPACE_TOKEN (preferred) or secrets.RAILWAY_TOKEN."
            exit 1
          fi

      - name: Resolve inputs
        id: params
        run: |
          TAG="${{ inputs.tag || 'latest' }}"
          ENV_CONFIG="${{ inputs.environment || 'production' }}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "env_config=$ENV_CONFIG" >> "$GITHUB_OUTPUT"

          echo "Deploy params:"
          echo "  tag: $TAG"
          echo "  env_config: $ENV_CONFIG"

      - name: Load Railway deploy config
        id: cfg
        env:
          ENV_CONFIG: ${{ steps.params.outputs.env_config }}
          TAG: ${{ steps.params.outputs.tag }}
          APP_ID: ${{ inputs.app_id }}
        run: |
          set -euo pipefail
          CONFIG_FILE="deploy/railway/${ENV_CONFIG}/${APP_ID}.yml"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Missing config: $CONFIG_FILE"
            echo "Add deploy/railway/${ENV_CONFIG}/<app_id>.yml for this app (see apps/registry.yaml)."
            ls -la "deploy/railway/${ENV_CONFIG}" || true
            exit 1
          fi

          PROJECT_NAME=$(yq -r '.railway.project_name' "$CONFIG_FILE")
          SERVICE_NAME=$(yq -r '.railway.service_name' "$CONFIG_FILE")
          ENV_NAME=$(yq -r '.railway.environment_name' "$CONFIG_FILE")

          REGISTRY=$(yq -r '.image.registry' "$CONFIG_FILE")
          REPOSITORY=$(yq -r '.image.repository' "$CONFIG_FILE")
          START_CMD=$(yq -r '.runtime.start_command' "$CONFIG_FILE")

          # Substitute our config template tokens
          REPOSITORY="${REPOSITORY//\{\{ github_repository_owner \}\}/${{ github.repository_owner }}}"

          if [ -z "$PROJECT_NAME" ] || [ "$PROJECT_NAME" = "null" ]; then
            echo "❌ railway.project_name missing in $CONFIG_FILE"; exit 1
          fi
          if [ -z "$SERVICE_NAME" ] || [ "$SERVICE_NAME" = "null" ]; then
            echo "❌ railway.service_name missing in $CONFIG_FILE"; exit 1
          fi
          if [ -z "$ENV_NAME" ] || [ "$ENV_NAME" = "null" ]; then
            echo "❌ railway.environment_name missing in $CONFIG_FILE"; exit 1
          fi
          if [ -z "$REGISTRY" ] || [ "$REGISTRY" = "null" ]; then
            echo "❌ image.registry missing in $CONFIG_FILE"; exit 1
          fi
          if [ -z "$REPOSITORY" ] || [ "$REPOSITORY" = "null" ]; then
            echo "❌ image.repository missing in $CONFIG_FILE"; exit 1
          fi
          if [ -z "$START_CMD" ] || [ "$START_CMD" = "null" ]; then
            echo "❌ runtime.start_command missing in $CONFIG_FILE"; exit 1
          fi

          IMAGE_REF="${REGISTRY}/${REPOSITORY}:${TAG}"

          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "service_name=$SERVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "environment_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          {
            echo "start_command<<STARTEOF"
            echo "$START_CMD"
            echo "STARTEOF"
          } >> "$GITHUB_OUTPUT"

          echo "Config loaded:"
          echo "  project: $PROJECT_NAME"
          echo "  service: $SERVICE_NAME"
          echo "  environment: $ENV_NAME"
          echo "  image: $IMAGE_REF"
          echo "  start_command: $START_CMD"

      - name: Login to GHCR (for digest lookup)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve GHCR digest (tag is not the production identity)
        id: pin
        env:
          IMAGE_REF: ${{ steps.cfg.outputs.image_ref }}
          REGISTRY: ${{ steps.cfg.outputs.registry }}
          REPOSITORY: ${{ steps.cfg.outputs.repository }}
        run: |
          set -euo pipefail
          echo "🔍 Resolving digest for: $IMAGE_REF"

          if ! docker buildx imagetools inspect "$IMAGE_REF" >/tmp/image-inspect.txt 2>/tmp/image-inspect.err; then
            echo "❌ Image not found or inspect failed: $IMAGE_REF"
            cat /tmp/image-inspect.err || true
            exit 1
          fi

          DIGEST=$(awk '/^Digest:/{print $2; exit}' /tmp/image-inspect.txt)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "❌ Could not parse a content digest from imagetools inspect"
            echo "--- inspect ---"
            cat /tmp/image-inspect.txt
            exit 1
          fi

          IMAGE_PIN="${REGISTRY}/${REPOSITORY}@${DIGEST}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_pin=$IMAGE_PIN" >> "$GITHUB_OUTPUT"
          echo "✅ Tag $IMAGE_REF → $IMAGE_PIN"

      - name: Resolve Railway IDs (project + service + environment)
        id: ids
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN_EFFECTIVE }}
          PROJECT_NAME: ${{ steps.cfg.outputs.project_name }}
          SERVICE_NAME: ${{ steps.cfg.outputs.service_name }}
          ENV_NAME: ${{ steps.cfg.outputs.environment_name }}
        run: |
          set -euo pipefail

          API="https://backboard.railway.com/graphql/v2"

          call_api () {
            curl -sS -X POST "$API" \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$1"
          }

          echo "🔍 Finding project ID for: $PROJECT_NAME"
          PROJECT_RESP=$(call_api '{"query":"{ projects { edges { node { id name } } } }"}')
          if echo "$PROJECT_RESP" | jq -e '.errors' >/dev/null 2>&1; then
            echo "❌ Railway API errors:"; echo "$PROJECT_RESP" | jq '.errors'; exit 1
          fi

          PROJECT_ID=$(echo "$PROJECT_RESP" | jq -r --arg n "$PROJECT_NAME" '.data.projects.edges[].node | select(.name==$n) | .id' | head -n 1)
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "❌ Project not found: $PROJECT_NAME"
            echo "Available projects:"
            echo "$PROJECT_RESP" | jq -r '.data.projects.edges[].node.name' | sed 's/^/  - /'
            exit 1
          fi
          echo "✅ Project ID: $PROJECT_ID"

          echo "🔍 Finding service ID for: $SERVICE_NAME"
          SERVICE_RESP=$(call_api "{\"query\":\"{ project(id:\\\"$PROJECT_ID\\\") { services { edges { node { id name } } } } }\"}")
          if echo "$SERVICE_RESP" | jq -e '.errors' >/dev/null 2>&1; then
            echo "❌ Railway API errors:"; echo "$SERVICE_RESP" | jq '.errors'; exit 1
          fi

          SERVICE_ID=$(echo "$SERVICE_RESP" | jq -r --arg n "$SERVICE_NAME" '.data.project.services.edges[].node | select(.name==$n) | .id' | head -n 1)
          if [ -z "$SERVICE_ID" ] || [ "$SERVICE_ID" = "null" ]; then
            echo "❌ Service not found: $SERVICE_NAME"
            echo "Available services:"
            echo "$SERVICE_RESP" | jq -r '.data.project.services.edges[].node.name' | sed 's/^/  - /'
            exit 1
          fi
          echo "✅ Service ID: $SERVICE_ID"

          echo "🔍 Finding environment ID for: $ENV_NAME"
          ENV_RESP=$(call_api "{\"query\":\"{ project(id:\\\"$PROJECT_ID\\\") { environments { edges { node { id name } } } } }\"}")
          if echo "$ENV_RESP" | jq -e '.errors' >/dev/null 2>&1; then
            echo "❌ Railway API errors:"; echo "$ENV_RESP" | jq '.errors'; exit 1
          fi

          ENV_ID=$(echo "$ENV_RESP" | jq -r --arg n "$ENV_NAME" '.data.project.environments.edges[].node | select(.name==$n) | .id' | head -n 1)
          if [ -z "$ENV_ID" ] || [ "$ENV_ID" = "null" ]; then
            echo "❌ Environment not found: $ENV_NAME"
            echo "Available environments:"
            echo "$ENV_RESP" | jq -r '.data.project.environments.edges[].node.name' | sed 's/^/  - /'
            exit 1
          fi
          echo "✅ Environment ID: $ENV_ID"

          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "service_id=$SERVICE_ID" >> "$GITHUB_OUTPUT"
          echo "environment_id=$ENV_ID" >> "$GITHUB_OUTPUT"

      - name: Set image source + start command, deploy, wait
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN_EFFECTIVE }}
          SERVICE_ID: ${{ steps.ids.outputs.service_id }}
          ENVIRONMENT_ID: ${{ steps.ids.outputs.environment_id }}
          IMAGE_PIN: ${{ steps.pin.outputs.image_pin }}
          IMAGE_REF: ${{ steps.cfg.outputs.image_ref }}
          START_CMD: ${{ steps.cfg.outputs.start_command }}
        run: |
          set -euo pipefail

          API="https://backboard.railway.com/graphql/v2"

          call_api () {
            curl -sS -X POST "$API" \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$1"
          }

          has_errors () {
            echo "$1" | jq -e '.errors != null' >/dev/null 2>&1
          }

          echo "🔎 Introspecting Railway GraphQL (mutation + input type + start-command field)"

          # Unwrap NON_NULL/LIST wrappers to the inner named type.
          TYPE_NAME_JQ='def named: if .name then .name elif .ofType then .ofType | named else empty end;'

          MUTATION_INTRO=$(call_api '{"query":"{ __type(name: \"Mutation\") { fields { name args { name type { name kind ofType { name kind ofType { name } } } } } } }"}')
          if has_errors "$MUTATION_INTRO"; then
            echo "❌ Mutation introspection failed:"
            echo "$MUTATION_INTRO" | jq '.errors'
            exit 1
          fi

          MUTATION_FIELDS=$(echo "$MUTATION_INTRO" | jq -r '.data.__type.fields // [] | .[].name')

          # Distinct mutation names: live docs vs older service-level update.
          MUTATION_NAME=""
          for candidate in serviceInstanceUpdate serviceUpdate; do
            if echo "$MUTATION_FIELDS" | grep -qx "$candidate"; then
              MUTATION_NAME="$candidate"
              break
            fi
          done
          if [ -z "$MUTATION_NAME" ]; then
            echo "❌ Live schema has neither serviceInstanceUpdate nor serviceUpdate."
            echo "Available mutations (filtered):"
            echo "$MUTATION_FIELDS" | grep -iE 'service|deploy' | sed 's/^/  - /' || true
            echo "Gap: cannot set image source. Stopping without a poke-deploy."
            exit 1
          fi
          echo "Chosen mutation: $MUTATION_NAME (probed: serviceInstanceUpdate, serviceUpdate)"

          INPUT_FROM_MUTATION=$(echo "$MUTATION_INTRO" | jq -r --arg m "$MUTATION_NAME" "$TYPE_NAME_JQ"'
            .data.__type.fields[] | select(.name == $m) | .args[] | select(.name == "input") | .type | named
          ')

          # Distinct input-type lookups: documented name, then whatever the mutation actually takes.
          INPUT_TYPE=""
          TYPE_INTRO=""
          TRIED_TYPES=""
          for candidate in ServiceInstanceUpdateInput "$INPUT_FROM_MUTATION"; do
            [ -n "$candidate" ] || continue
            case " $TRIED_TYPES " in
              *" $candidate "*) continue ;;
            esac
            TRIED_TYPES="$TRIED_TYPES $candidate "
            TYPE_INTRO=$(call_api "$(jq -n --arg n "$candidate" '{query: ("{ __type(name: \"" + $n + "\") { name inputFields { name } } }")}')")
            if has_errors "$TYPE_INTRO"; then
              echo "⚠️ __type($candidate) returned errors:"; echo "$TYPE_INTRO" | jq '.errors'
              continue
            fi
            found=$(echo "$TYPE_INTRO" | jq -r '.data.__type.name // empty')
            if [ -n "$found" ]; then
              INPUT_TYPE="$found"
              break
            fi
            echo "⚠️ __type($candidate) is null"
          done
          if [ -z "$INPUT_TYPE" ]; then
            echo "❌ Could not resolve an input type (probed ServiceInstanceUpdateInput, then mutation input arg: '${INPUT_FROM_MUTATION:-<none>}')."
            echo "Gap: this workflow cannot set the image source. Stopping without a poke-deploy."
            exit 1
          fi
          echo "Chosen input type: $INPUT_TYPE (mutation input arg was: ${INPUT_FROM_MUTATION:-<none>})"

          FIELDS=$(echo "$TYPE_INTRO" | jq -r '.data.__type.inputFields[]?.name // empty')
          echo "$INPUT_TYPE fields:"
          echo "$FIELDS" | sed 's/^/  - /'

          if ! echo "$FIELDS" | grep -qx 'source'; then
            echo "❌ Live schema has no 'source' on ${INPUT_TYPE}."
            echo "Gap: GraphQL cannot set the service image. Stopping."
            exit 1
          fi

          # Distinct field names: GraphQL camelCase vs snake_case.
          START_FIELD=""
          for candidate in startCommand start_command; do
            if echo "$FIELDS" | grep -qx "$candidate"; then
              START_FIELD="$candidate"
              break
            fi
          done
          if [ -z "$START_FIELD" ]; then
            echo "❌ Live schema has neither startCommand nor start_command on ${INPUT_TYPE}."
            echo "Gap: cannot apply runtime.start_command. Stopping."
            exit 1
          fi
          echo "Chosen start-command field: $START_FIELD (probed: startCommand, start_command)"

          list_deployments () {
            local payload r
            payload=$(jq -n --arg sid "$SERVICE_ID" --arg eid "$ENVIRONMENT_ID" '{
              query: "query($sid: String!, $eid: String!) { deployments(first: 10, input: { serviceId: $sid, environmentId: $eid }) { edges { node { id status createdAt } } } }",
              variables: { sid: $sid, eid: $eid }
            }')
            r=$(call_api "$payload")
            if has_errors "$r"; then
              payload=$(jq -n --arg id "$SERVICE_ID" '{
                query: "query($id: String!) { service(id: $id) { deployments(first: 10) { edges { node { id status createdAt } } } } }",
                variables: { id: $id }
              }')
              r=$(call_api "$payload")
              if has_errors "$r"; then
                echo "❌ Could not list deployments:" >&2
                echo "$r" | jq '.errors' >&2
                echo "[]"
                return 1
              fi
              echo "$r" | jq -c '.data.service.deployments.edges // []'
            else
              echo "$r" | jq -c '.data.deployments.edges // []'
            fi
          }

          echo "📸 Snapshotting deployments before source update"
          OLD_EDGES=$(list_deployments)
          OLD_IDS=$(echo "$OLD_EDGES" | jq -r '.[].node.id')
          echo "Existing deployment ids:"
          echo "${OLD_IDS:-<none>}" | sed 's/^/  - /'

          echo "🔧 Setting Railway source image + ${START_FIELD}"
          echo "  image: $IMAGE_PIN"
          echo "  (from tag $IMAGE_REF)"
          echo "  ${START_FIELD}: $START_CMD"

          send_update () {
            local image="$1"
            local query
            query=$(jq -n \
              --arg sid "$SERVICE_ID" \
              --arg eid "$ENVIRONMENT_ID" \
              --arg img "$image" \
              --arg cmd "$START_CMD" \
              --arg inputType "$INPUT_TYPE" \
              --arg startField "$START_FIELD" \
              --arg mutationName "$MUTATION_NAME" \
              '{
                query: ("mutation Update($serviceId: String!, $environmentId: String, $input: " + $inputType + "!) { " + $mutationName + "(serviceId: $serviceId, environmentId: $environmentId, input: $input) }"),
                variables: {
                  serviceId: $sid,
                  environmentId: $eid,
                  input: ({ source: { image: $img } } + { ($startField): $cmd })
                }
              }')
            call_api "$query"
          }

          UPDATE_RESP=$(send_update "$IMAGE_PIN")
          if has_errors "$UPDATE_RESP"; then
            ERR_MSG=$(echo "$UPDATE_RESP" | jq -r '[.errors[].message] | join("; ")')
            echo "⚠️ serviceInstanceUpdate with digest pin failed: $ERR_MSG"

            if echo "$ERR_MSG" | grep -qiE 'selection|subfield|must have a selection'; then
              echo "Retrying serviceInstanceUpdate with { id } selection set"
              QUERY=$(jq -n \
                --arg sid "$SERVICE_ID" \
                --arg eid "$ENVIRONMENT_ID" \
                --arg img "$IMAGE_PIN" \
                --arg cmd "$START_CMD" \
                --arg inputType "$INPUT_TYPE" \
                --arg startField "$START_FIELD" \
                --arg mutationName "$MUTATION_NAME" \
                '{
                  query: ("mutation Update($serviceId: String!, $environmentId: String, $input: " + $inputType + "!) { " + $mutationName + "(serviceId: $serviceId, environmentId: $environmentId, input: $input) { id } }"),
                  variables: {
                    serviceId: $sid,
                    environmentId: $eid,
                    input: ({ source: { image: $img } } + { ($startField): $cmd })
                  }
                }')
              UPDATE_RESP=$(call_api "$QUERY")
            elif echo "$ERR_MSG" | grep -qiE 'image|digest|sha256|invalid'; then
              PIN_WITH_TAG="${IMAGE_REF}@${IMAGE_PIN##*@}"
              echo "Retrying source.image as tag@digest: $PIN_WITH_TAG"
              UPDATE_RESP=$(send_update "$PIN_WITH_TAG")
            fi
          fi

          if has_errors "$UPDATE_RESP"; then
            echo "❌ serviceInstanceUpdate failed. Railway did not receive the image."
            echo "$UPDATE_RESP" | jq
            echo "Not calling serviceInstanceDeploy (that would poke the previous source)."
            exit 1
          fi

          echo "✅ Source updated"
          echo "$UPDATE_RESP" | jq -c --arg m "$MUTATION_NAME" '.data[$m]'

          echo "🚀 Triggering deployment of the pinned image"
          DEPLOY_MUTATION=$(jq -n \
            --arg serviceId "$SERVICE_ID" \
            --arg environmentId "$ENVIRONMENT_ID" \
            '{
              query: "mutation Deploy($serviceId: String!, $environmentId: String!) { serviceInstanceDeploy(serviceId: $serviceId, environmentId: $environmentId) }",
              variables: { serviceId: $serviceId, environmentId: $environmentId }
            }')

          DEPLOY_RESP=$(call_api "$DEPLOY_MUTATION")
          if has_errors "$DEPLOY_RESP"; then
            echo "❌ Deploy call failed:"; echo "$DEPLOY_RESP" | jq '.errors'; exit 1
          fi

          OK=$(echo "$DEPLOY_RESP" | jq -r '.data.serviceInstanceDeploy // empty')
          if [ "$OK" != "true" ]; then
            echo "❌ Deploy mutation did not return true. Full response:"
            echo "$DEPLOY_RESP" | jq
            exit 1
          fi

          echo "✅ Deploy triggered. Waiting for a deployment created after the source update..."

          MAX_WAIT=900
          INTERVAL=10
          ELAPSED=0
          TARGET_ID=""

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            EDGES=$(list_deployments || echo '[]')
            if [ -z "$TARGET_ID" ]; then
              TARGET_ID=$(echo "$EDGES" | jq -r --argjson old "$(echo "$OLD_EDGES")" '
                (map(.node) | sort_by(.createdAt) | reverse) as $n
                | ($n | map(select(.id as $id | ($old | map(.node.id) | index($id) | not))) | .[0].id)
                // empty
              ')
              if [ -z "$TARGET_ID" ]; then
                echo "Waiting for a new deployment to appear... (${ELAPSED}s)"
                sleep $INTERVAL
                ELAPSED=$((ELAPSED + INTERVAL))
                continue
              fi
              echo "▶️ Tracking new deployment: $TARGET_ID"
            fi

            STATUS=$(echo "$EDGES" | jq -r --arg id "$TARGET_ID" '.[] | select(.node.id==$id) | .node.status // empty')
            if [ -z "$STATUS" ]; then
              STATUS="UNKNOWN"
            fi
            echo "Deployment $TARGET_ID  status=$STATUS  (${ELAPSED}s)"

            case "$STATUS" in
              ACTIVE|SUCCESS)
                echo "✅ Deployment complete: $STATUS"
                echo "deployment_id=$TARGET_ID" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED|CRASHED|ERROR)
                echo "❌ Deployment failed: $STATUS"
                echo "deployment_id=$TARGET_ID" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
              *)
                sleep $INTERVAL
                ELAPSED=$((ELAPSED + INTERVAL))
                ;;
            esac
          done

          echo "❌ Timed out waiting for deployment after ${MAX_WAIT}s"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Railway Deploy"
            echo "- **Project:** ${{ steps.cfg.outputs.project_name }}"
            echo "- **Service:** ${{ steps.cfg.outputs.service_name }}"
            echo "- **Environment:** ${{ steps.cfg.outputs.environment_name }}"
            echo "- **Image tag (lookup only):** \`${{ steps.cfg.outputs.image_ref }}\`"
            echo "- **Image digest (what Railway should run):** \`${{ steps.pin.outputs.image_pin }}\`"
            echo "- **Start command:** \`${{ steps.cfg.outputs.start_command }}\`"
            if [ -n "${{ steps.deploy.outputs.deployment_id }}" ]; then
              echo "- **Deployment ID:** \`${{ steps.deploy.outputs.deployment_id }}\`"
            fi
            echo "- **Status:** ${{ job.status }}"
            echo ""
            echo "**Links**"
            echo "- Railway Dashboard: https://railway.app"
            echo "- GHCR Package: https://github.com/${{ github.repository }}/pkgs/container/$(echo '${{ inputs.app_id }}' | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_STEP_SUMMARY"
