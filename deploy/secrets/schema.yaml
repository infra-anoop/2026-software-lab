# Canonical secret name → vault ref map (A20). Values live in Infisical Cloud, not git.
# Provider is data: adapters (A21) read this; do not hardcode Infisical↔Railway in apps.
# A25: LOGFIRE_TOKEN is required in this map for every listed app×env.

schema_version: 1

vault:
  provider: infisical_cloud

# Secrets synced to a RuntimeTarget (Railway today, Vercel later). Names must be ⊆
# each app's Settings ALL_ENV_NAMES. `required: true` ⇒ must appear for that app
# (OPENAI today). Others are optional at runtime but still have a vault path.
applications:
  research-auditor:
    environments:
      production:
        secrets:
          - name: OPENAI_API_KEY
            required: true
            vault_ref: { project: research-auditor, env: production, path: /, key: OPENAI_API_KEY }
          - name: RESEARCH_AUDITOR_AUDIT_SECRET
            required: false
            vault_ref: { project: research-auditor, env: production, path: /, key: RESEARCH_AUDITOR_AUDIT_SECRET }
          - name: SUPABASE_URL
            required: false
            vault_ref: { project: research-auditor, env: production, path: /, key: SUPABASE_URL }
          - name: SUPABASE_SECRET_KEY
            required: false
            vault_ref: { project: research-auditor, env: production, path: /, key: SUPABASE_SECRET_KEY }
          - name: LOGFIRE_TOKEN
            required: false
            vault_ref: { project: research-auditor, env: production, path: /, key: LOGFIRE_TOKEN }
      staging:
        secrets:
          - name: OPENAI_API_KEY
            required: true
            vault_ref: { project: research-auditor, env: staging, path: /, key: OPENAI_API_KEY }
          - name: RESEARCH_AUDITOR_AUDIT_SECRET
            required: false
            vault_ref: { project: research-auditor, env: staging, path: /, key: RESEARCH_AUDITOR_AUDIT_SECRET }
          - name: SUPABASE_URL
            required: false
            vault_ref: { project: research-auditor, env: staging, path: /, key: SUPABASE_URL }
          - name: SUPABASE_SECRET_KEY
            required: false
            vault_ref: { project: research-auditor, env: staging, path: /, key: SUPABASE_SECRET_KEY }
          - name: LOGFIRE_TOKEN
            required: false
            vault_ref: { project: research-auditor, env: staging, path: /, key: LOGFIRE_TOKEN }
  smart-writer:
    environments:
      production:
        secrets:
          - name: OPENAI_API_KEY
            required: true
            vault_ref: { project: smart-writer, env: production, path: /, key: OPENAI_API_KEY }
          - name: SMART_WRITER_AUDIT_SECRET
            required: false
            vault_ref: { project: smart-writer, env: production, path: /, key: SMART_WRITER_AUDIT_SECRET }
          - name: SUPABASE_URL
            required: false
            vault_ref: { project: smart-writer, env: production, path: /, key: SUPABASE_URL }
          - name: SUPABASE_SECRET_KEY
            required: false
            vault_ref: { project: smart-writer, env: production, path: /, key: SUPABASE_SECRET_KEY }
          - name: LOGFIRE_TOKEN
            required: false
            vault_ref: { project: smart-writer, env: production, path: /, key: LOGFIRE_TOKEN }
          - name: TAVILY_API_KEY
            required: false
            vault_ref: { project: smart-writer, env: production, path: /, key: TAVILY_API_KEY }
