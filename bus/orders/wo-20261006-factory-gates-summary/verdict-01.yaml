findings:
  - id: T-GS1
    severity: blocker
    tag: product
    text: >-
      Root cause: boundary case not exercised. The only no-summary case selects
      two gates, so an implementation can post factory/gates whenever an
      explicit selection contains every installed gate, violating the ruling
      that any --gate use is a subset run. Add one explicit all-gates contract
      regression that requires no summary.
  - id: T-GS2
    severity: blocker
    tag: product
    text: >-
      Root cause: oracle disconnected from posting path. The missing-gate
      assertion calls a new helper directly, so the CLI can bypass it and post
      success from an incomplete report. Add one CLI-level omitted-report-entry
      regression requiring failure that names the missing installed gate.
  - id: T-GS3
    severity: debate
    tag: process
    text: >-
      Review severity: Should (represented as debate because the bus schema has
      no should value). Requiring the exact internal symbol and signature
      summary_status(report, gates) rejects correct inline or differently
      factored implementations without proving the CLI uses that helper.
  - id: T-GS4
    severity: nit
    tag: process
    text: >-
      Strength: all 14 expected failures are assertions at intended missing
      behavior with no collection error; the real CLI and status adapter cover
      ordering, installed versus head registry, outcomes, ruleset replacement,
      and GitHub Actions source pinning.
