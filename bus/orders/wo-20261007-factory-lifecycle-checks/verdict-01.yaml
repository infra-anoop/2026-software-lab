findings:
  - id: T-LC1
    severity: blocker
    tag: product
    text: >-
      Root-cause class: the fixture fixes row ids as non-gates and puts its
      catalog on main, making classification precedence and source boundaries
      unobservable. Lifecycle can therefore read the head registry, read only
      main catalogs, or classify a gate/row collision as a gate while the suite
      passes, falsely accepting or withholding acceptance for work-order
      authors. Likelihood is high because each is a natural implementation
      shortcut. Add one non-parametrized classification-matrix regression for
      catalog-first collision, installed-registry classification, PR-head
      catalog classification, and linkage not satisfying a registered gate;
      the first three rows make that test red on base.
  - id: T-LC2
    severity: debate
    tag: process
    text: >-
      Existing gate-id cases never combine a missing factory/<gate-id> status
      with green factory/catalog-test-linkage, so they do not prevent linkage
      from vouching for a registered gate. Include this case in the single red
      classification matrix instead of adding an isolated always-green test.
  - id: T-LC3
    severity: nit
    tag: process
    text: >-
      Strength: all seven new failures are state assertions at the intended
      missing behavior, with no collection/import errors or mocks bypassing
      derive_snapshot.
  - id: T-LC4
    severity: nit
    tag: process
    text: >-
      Strength: the suite explicitly rejects a row's own green status, an
      override naming the row, and a green status for an unknown id, blocking
      three direct constant-answer implementations.
