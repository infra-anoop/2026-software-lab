summary: |
  `factory gate run` now reports results per intent id, in text and --json (T064).
  For each intent its gates.yaml rows serve, the report gives the gates, each one's
  pass/fail/overridden outcome, and whether the intent held, broke, or held only by override.
  The new report key is `per_intent`; text prints one line per intent. Subset runs list
  only the gates that ran. Result-supplied intent ids never add rows (amendment-01).
  The legacy `intents` key and all posted commit statuses are unchanged; no workflow edit.
  Tests were red first and T*-accepted at round 2 (verdict-02); the catalog row
  handoff.per_intent_results now names the six passing tests.
