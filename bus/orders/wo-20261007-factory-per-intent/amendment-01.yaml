#      by the `factory gate run` report (text, which CI shows in the job log, and --json). A
#      GitHub job-summary file needs a workflow edit and is not part of this order. The goal is
#      superseded to say so; the job-summary file is a backlog item (Wave 1 retro agenda).
#   2. Intent ids: a gate's results are listed under the intents its gates.yaml row serves.
#      Ids a result names in its own message (for example the unmapped ids of
#      factory-check-intent) stay in that message and do not create per-intent rows.
#   3. Wording: an intent kept passing only by an override is `overridden`, never `held`.
