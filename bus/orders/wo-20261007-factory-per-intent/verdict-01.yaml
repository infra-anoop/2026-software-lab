findings:
  - id: T-PI1
    severity: blocker
    tag: product
    text: >-
      Root cause: the fixture copies each gates.yaml intent list into
      GateResult.intent_ids, making the required registry source
      indistinguishable from the forbidden result-supplied source. Consequence:
      an implementation can pass while factory-check-intent is reported under
      unmapped ids instead of I-N1 and I-P4, giving the governor the wrong held
      or broken intent. Likelihood is high because group_by_intent already
      prefers result ids. Smallest fix: make one stub return conflicting
      sentinel ids and assert only the gate registry row controls the report.
  - id: T-PI2
    severity: debate
    tag: product
    text: >-
      Every new assertion uses a full registry run, while the supported
      explicit --gate path is unpinned. Lock whether subset runs carry the
      richer section; preferably add one selected-gate case requiring exactly
      that gate's registry intents and no unrelated rows.
  - id: T-PI3
    severity: debate
    tag: product
    text: >-
      The packet calls the change additive, but the complete existing intents
      mapping is not pinned. An implementation can add correct per_intent data
      while dropping or corrupting legacy rows beyond the single old I-M2
      assertion. Pin complete equivalence or explicitly retire the old field.
  - id: T-PI4
    severity: nit
    tag: process
    text: >-
      Strength: the trusted PR regression pins every posted status SHA,
      context, state, description, and order, then fails on the absent
      per_intent report. This accurately protects the unchanged-status
      boundary.
