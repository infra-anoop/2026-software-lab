#   5. **Severity mismatch:** in amendment-05, state that PR-A4/A5/A6 are should-fix. Do not edit
#      verdict-05; it is immutable.
#
# New finding:
#   PR-A7 | should-fix | process | found by implementer (Slice A worker) | orders/git.py::push
#     A push that git rejects client-side ("[rejected] (fetch first)" / non-fast-forward) prints
#     that status on `--porcelain` stdout; stderr carries only "failed to push some refs", which
#     matches no rejection marker, so a lost lease race exits 4 (external) instead of 2 (refused).
#     A rejection at the remote's ref lock is already classified correctly (exit 2).
#     Tests: test_claim.py::test_claim_fast_forward_exactly_one_of_two_concurrent_wins (amended:
#     the loser must exit 2; nondeterministic, since the loser usually refuses at "already
#     claimed"), test_claim.py::test_lost_claim_race_at_the_push_is_refused (new, deterministic:
#     per-clone receivepack delays force the client-side rejection; red [0, 4] today), and
#     test_git_safety.py::test_handoff_push_rejection_leaves_local_refs_and_worktree_unchanged.
#
# Severity (decision 5): PR-A4, PR-A5 and PR-A6 are should-fix. verdict-05 says `later` and stays
#   as written (immutable); this amendment is the operative severity.
#
# Supersedes in amend-04 (comment text, not order fields):
#   - "Chosen behaviour, PR-A5", bullet "Exit" and the whole "Fidelity delta, disclosed, not
#     waived" bullet. No fidelity gap remains: SC-013 is held to the letter. Exit rule now:
#       wave1_exit = date of the main commit of the last Wave 1 landing (first-parent), only when
#       (a) every Wave 1 order in scope has a run_complete, a latest verdict of accept, and has
#           landed on main;
#       (b) every `priority: P1` gate in the factory's gates.yaml resolves:
#           importlib.import_module(module) and getattr(function) succeed (resolution only; the
#           scorecard never runs a gate);
#       (c) GitHubPort.list_commit_statuses(<that main commit>) has state `success` for
#           `factory/<gate-id>` of every P1 gate. Missing, pending, failure or error means no
#           exit; an override does not stand in for `success`. Statuses on any other commit don't
#           count. Without a GitHub port (c) cannot be confirmed, so wave1_exit is null.
#       Otherwise wave1_exit, wave1_working_days and wave1_within_timebox are null.
#       `factory scorecard` reads (c) through DEPS.github, the same port `factory status` uses.
#     Tests: test_scorecard.py::test_scorecard_wave1_exit_when_every_order_merged (accepted,
#     amended: statuses on the exit commit, P1 entrypoints resolvable, read via the CLI), and
#     ::test_scorecard_wave1_not_exited_unless_every_p1_gate_implemented_and_green[status-missing|
#     status-failure|status-on-other-commit|unresolvable] (new). Resolvability is set in the test
#     environment by the `p1_implemented` fixture (stub modules in sys.modules); slices B and C
#     own the real gate modules.
#   - "Open item for the orchestrator": resolved by decision 2. The two accepted tests now read
#     origin/wo/<id> after `git fetch`; assertions unchanged.
#   Wave 1 cohort (retro boundary) and sprint scope from amend-04 stand, provisionally (decision 4).
#
# Noted for orchestrator triage (no disposition; no test added):
