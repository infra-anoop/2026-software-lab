#   3. **SC-013 'every P1 check implemented and passing': keep to the LETTER and do NOT waive.**
#      Wave 1 exit requires all three of the following:
#      - (a) every Wave 1 order has a run record and has been accepted and landed, as you have it;
#      - (b) every `priority: P1` row in `gates.yaml` is implemented, meaning its entrypoint
