decision: reject
findings:
  - id: PR-A1
    severity: blocker
    tag: product
    text: >-
      The GitHub App JWT and credential-response functions have no production caller:
      REST still uses GITHUB_TOKEN, no installation id is obtained, and git is never
      given an installation token. The locked separate-agent identity is not usable.
  - id: PR-A2
    severity: blocker
    tag: process
    text: >-
      advance_local_branch runs git merge --ff-only when the order branch is checked
      out, touching the caller's index and worktree; handoff does this before push, so a
      rejected push can leave an unpushed local commit checked out.
  - id: PR-A3
    severity: blocker
    tag: process
    text: >-
      The PR rewrites the packet Status and DoD checkboxes even though the packet is not
      in the original or amended owned paths. Revert this out-of-scope bookkeeping edit.
  - id: PR-A4
    severity: later
    tag: product
    text: >-
      Claim admission keeps a closed-unmerged PR active until an explicit release,
      contrary to the approved lifecycle where closed-unmerged is released and excluded
      from capacity.
  - id: PR-A5
    severity: later
    tag: product
    text: >-
      Wave 1 exit is derived only from every visible order landing on main; it does not
      require all P1 checks passing and is not scoped to the Wave 1 cohort or sprint.
  - id: PR-A6
    severity: later
    tag: process
    text: >-
      The registered-gate handoff refusal test passes before gate execution because its
      fixture never commits a handoff. Fix it in a test-only follow-up through T*.
