# Orchestrator triage of T* round 5 (verdict-06, review/wo-20261004-factory-slice-a-r5 @ 577122d).
# Recorded by the Slice A worker on the orchestrator's instruction (2026-10-05).
# Orchestrator-adjudicated (process). Still Phase 1: tests only, no fix code.
#
# Orchestrator decision (verbatim, summarised where long):
#   Triage (orchestrator, process): FIX both. The reviewer accepted all other amendments and
#   choices (T-A5-3); keep them.
#   T-A5-1: replace the sleeps with an explicit barrier. Each clone gets a
#     `remote.origin.receivepack` wrapper that writes `arrived-<n>`, blocks until `go-<n>`
#     exists, then execs the real `git-receive-pack`. The test waits (bounded poll) until BOTH
#     have arrived, releases go-1, waits for claimer 1 to exit, then releases go-2. Assert
#     evidence the intended path was reached. Fix the winner order so PR-A7 cannot invert. For
#     PR-A8, check that the ref advertisement makes the second push 'up to date' under the
#     barrier. Bounded timeouts so a broken implementation fails rather than hangs.
#   T-A5-2: complete the PR-A2 coverage: a checked-out-branch success case for handoff and for
#     verdict; a branch checked out in ANOTHER linked worktree; a successful compare-and-swap
#     fast-forward of a local branch that is NOT checked out; refusal when the local branch has
#     diverged from origin; push-rejection safety where origin is moved AFTER the event is
#     built and BEFORE the push, reusing the same receivepack barrier.
#   On load testing: skip the CPU-stress run; the barrier makes ordering independent of load by
#     construction, and 12/12 repeat runs are sufficient evidence.
#
# How the barrier guarantees each path (tests/contract/push_barrier.py):
#   - git runs the receivepack wrapper only when the command connects to push, i.e. after it has
#     fetched and built its event. `arrived-<n>` therefore proves the command is past fetch and
#     build; no ref advertisement has been sent yet.
#   - The wrapper records origin's refs in `advertised-<n>` after `go-<n>` and immediately before
#     exec'ing receive-pack; the test writes origin only while pushes are held, so that file is
#     exactly the advertisement the client sees.
#   - PR-A7: both claimers arrive before either push is released, so both built on the
#     unclaimed tip. Claimer 1 is released and must exit; then claimer 2's receive-pack advertises
#     claimer 1's commit, which claimer 2 does not hold (checked while it is still blocked): git
#     rejects client-side, `[rejected] (fetch first)`. Winner order is fixed: [0, 2].
#   - PR-A8: same orchestration with pinned clock, commit dates and actor. Claimer 2 holds the
#     exact commit origin now has (it built it itself; checked while blocked), and the
#     advertisement shows it, so git reports up to date. Verified by hand: with `--quiet` git
#     prints no `=` line at all (only `Done`, exit 0); without `--quiet` it prints
#     `=\t<src>:<dst>\t[up to date]`. Note for phase 2: today's push() passes `--quiet`, so the
#     fix must drop it or compare the advertised/remote ref to observe the PR-A8 outcome.
#   - Push-rejection safety: origin is moved inside the bare origin only after the handoff push
#     has arrived, so any initial fetch saw origin unchanged and only the push can fail.
#   - Bounds: the wrapper exits 1 after 30 s unreleased; the test polls at most 30 s for arrival
#     and fails at once if a command exits before arriving; results wait at most 60 s.
#
# Interpretation recorded (no new lock): "refusal when the local branch has diverged" follows
#   amendment-04's letter: origin still takes the event (exit 0) and the divergent local branch
#   is refused the fast-forward, left where it was, and reported with `git pull --ff-only`.
#
# Tests (Phase 1 record):
#   T-A5-1  tests/contract/test_claim.py::test_lost_claim_race_at_the_push_is_refused (PR-A7,
#             rewritten on the barrier; red [0, 4])
#           tests/contract/test_claim.py::test_identical_same_second_claims_have_one_winner
#             (PR-A8, rewritten on the barrier; red [0, 0])
#   T-A5-2  tests/contract/test_git_safety.py (PR-A2):
#             test_handoff_and_verdict_leave_a_checked_out_order_branch_where_it_was[handoff|verdict]
#               (new; red: local branch moved)
#             test_claim_leaves_an_order_branch_checked_out_in_another_worktree_alone
#               (new; red: linked worktree's branch moved)
#             test_claim_fast_forwards_an_order_branch_that_is_not_checked_out
#               (new; green guard: CAS fast-forward already works)
#             test_claim_leaves_a_diverged_local_order_branch_alone[before-command|during-push]
#               (new; red: no `git pull --ff-only` report; during-push diverges while the push is
#               held, so a non-CAS advance would overwrite it)
#             test_handoff_push_rejection_leaves_local_refs_and_worktree_unchanged
#               (rewritten: origin moved while the push is held; red: local branch moved)
#   Helper `_on_origin` now reads the bare origin directly instead of the caller's
#   remote-tracking ref.
#   Repetitions: 12/12 runs of the barrier tests plus the accepted race test gave identical
#   outcomes. Three single-core runs beside four busy loops (finished before the orchestrator
#   stopped the stress attempt) gave the same outcomes.
#
