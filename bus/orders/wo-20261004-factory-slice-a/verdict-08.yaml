findings:
  - id: T-A7-1
    severity: nit
    tag: process
    text: >-
      T-A6-1 is resolved. Held-command arrival and result polls have monotonic
      deadlines; timeout, early exit, and context exit kill every child process
      group; cleanup repeatedly SIGKILLs until the direct child is reaped and
      /proc shows no live group member, with its own ten-second deadline. Four
      green meta-tests cover never-arrives, never-exits, context-exit cleanup,
      successful return, and child exception behavior.
  - id: T-A7-2
    severity: nit
    tag: process
    text: >-
      Amendment-09 is not a weakening. The accepted atomic-race test still
      starts two claims back-to-back without a barrier and retains exactly one
      OK, exactly one REFUSED, and claim-on-origin assertions. Forking makes the
      two claims genuinely process-parallel while bounding them. Twelve of
      twelve repetitions kept this guard green and retained the intended PR-A7
      and PR-A8 reds.
  - id: T-A7-3
    severity: later
    tag: process
    text: >-
      Synchronous in-process CLI calls and pre-existing fixture/helper
      subprocess.run calls elsewhere in the suite have no timeout. A wedged git,
      openssl, or frozen fixture could therefore hang a broader test run, but
      these calls are outside T-A6-1's held race/barrier class, were not
      introduced by amendments 08 or 09, and did not hang in verification.
      Record a non-blocking Later for a suite-wide timeout policy when CP0
      fixtures are next amended.
