findings:
  - id: T-A1
    severity: blocker
    tag: process
    text: >-
      The board contract test does not pin every fixture order to its section and
      rendered state, so a renderer that misplaces merged, released, accepted, or
      rejected orders can pass while SC-001 fails.
  - id: T-A2
    severity: blocker
    tag: process
    text: >-
      The order-issue test selects the repository root commit, which contradicts
      creating wo/<id> from main; select the first branch-only commit and assert its
      parent is origin/main.
  - id: T-A3
    severity: blocker
    tag: process
    text: >-
      The REST status round trip reads a static recording, so a no-op status writer
      passes; capture the POST and assert method, path, auth, and payload.
  - id: T-A4
    severity: blocker
    tag: product
    text: >-
      The App JWT is accepted as any three dot-separated strings; verify the RS256
      signature, issuer, iat/exp bounds, the installation id in the exchange path, and
      the recorded installation-token expiry (D4-A letter fidelity).
  - id: T-A5
    severity: blocker
    tag: process
    text: >-
      Only the positive accept-plus-one-green-check case exists; failed, pending,
      missing, and mixed required checks must keep the order non-accepted.
  - id: T-A6
    severity: blocker
    tag: process
    text: >-
      wave1_exit is only asserted as None; add an all-merged fixture with a
      deterministic exit date and a five-working-day boundary case.
  - id: T-A7
    severity: debate
    tag: process
    text: >-
      No claim contract case proves a stale claim still consumes one of the three
      slots; two fresh plus one stale claim must refuse a fourth.
  - id: T-A8
    severity: debate
    tag: process
    text: >-
      Verdict tests are refusal-only; add a valid verdict commit path and separate
      nonexistent-path and nonexistent-sha negatives.
  - id: T-A9
    severity: nit
    tag: process
    text: >-
      Strength: tests collect and fail at call-site seams with no collection errors or
      xfails; preserve this red-first shape.
