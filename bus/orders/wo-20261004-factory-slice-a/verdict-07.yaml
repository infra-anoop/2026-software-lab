findings:
  - id: T-A6-1
    severity: blocker
    tag: process
    text: >-
      The receive-pack wrapper, arrival poll, and Future.result calls have
      explicit deadlines, but the factory commands still run inside
      ThreadPoolExecutor context managers. If a command hangs after release,
      Future.result(timeout=...) raises and executor __exit__ immediately calls
      shutdown(wait=True), which waits without a bound for the same running
      future. Thus the deterministic barrier can still hang pytest indefinitely
      and does not meet the requirement that every wait be bounded. Run held
      commands in a killable process/subprocess with deadline termination, or
      provide an equivalent hard test-wide timeout that interrupts executor
      shutdown while preserving the current release ordering and advertisement
      assertions.
  - id: T-A6-2
    severity: nit
    tag: process
    text: >-
      The round-5 scheduling race is otherwise resolved. Both clients reach
      receive-pack before either receives an advertisement, claimer 1 exits
      before claimer 2 is released, and object-presence plus advertised-ref
      assertions distinguish PR-A7 fetch-first rejection from PR-A8 up-to-date.
      Twelve fresh repetitions produced the identical intended current-code
      outcomes.
  - id: T-A6-3
    severity: nit
    tag: process
    text: >-
      T-A5-2 is resolved. The PR-A2 suite now covers handoff and verdict with the
      order branch checked out, a linked-worktree checkout, successful CAS of a
      non-checked-out branch, divergence before command and during push, and a
      remote move after event construction. Every red case fails at its stated
      current-code seam; the successful non-checked-out CAS case is an intended
      green guard. The suite remains jointly satisfiable.
