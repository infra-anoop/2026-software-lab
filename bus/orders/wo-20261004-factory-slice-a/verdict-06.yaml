findings:
  - id: T-A5-1
    severity: blocker
    tag: process
    text: >-
      The PR-A7 and PR-A8 tests do not deterministically force both claimers past
      their fetch before either push lands. They rely on ThreadPoolExecutor
      scheduling plus one- and three-second receivepack sleeps. On a loaded
      two-core runner the second task can fetch after the first push and refuse as
      already claimed, making both tests pass without exercising the porcelain
      rejected or up-to-date outcomes; PR-A7 can also invert its asserted winner.
      Synchronize the two clients at the pre-push seam and explicitly order the
      receivepack advertisements instead of using elapsed sleeps.
  - id: T-A5-2
    severity: blocker
    tag: process
    text: >-
      The PR-A2 safety suite does not pin the whole amended behavior. Successful
      checked-out-branch cases cover claim and release only, so handoff or verdict
      may still move the checkout. No case covers a branch checked out in another
      linked worktree, successful compare-and-swap advancement of a non-checked-out
      local branch, or leaving a divergent local branch alone. The handoff rejection
      fixture moves origin before command start, so an implementation that refuses
      during an initial fetch can pass without proving that a rejection at push
      leaves refs, index, and worktree unchanged. Add executable cases for those
      paths and force the remote move after the command has built its event.
  - id: T-A5-3
    severity: nit
    tag: process
    text: >-
      The accepted-test amendments are justified and do not weaken their original
      assertions: origin/wo is the authoritative pushed ref, a lost claim race is
      exit 2, the handoff fixture now reaches its named gate, and the scorecard
      exercises the CLI with P1 status evidence. sys.modules stubs are a legitimate
      test seam for sibling-owned gate entrypoints because production still performs
      ordinary import resolution and the scorecard must not execute gates. The
      retro-on-main cohort boundary and refs-based sprint membership are coherent,
      explicit, and jointly satisfiable.
