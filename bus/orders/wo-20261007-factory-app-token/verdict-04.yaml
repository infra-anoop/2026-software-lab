findings:
  - id: R-AT1
    severity: blocker
    tag: product
    text: >-
      Successful installation lookup or token-mint HTTP responses with malformed
      JSON, missing fields, or invalid timestamps escape as KeyError, JSON decode
      errors, or ValueError instead of AppTokenError. Those exceptions bypass the
      CLI's external-error mapping rather than exiting 4, and an invalid timestamp
      value is copied into ValueError text, permitting token-shaped response content
      in the exception chain. A probe against a 201 empty mint response raised
      KeyError for expires_at. Validate response decoding inside the App-token
      boundary and convert every shape or timestamp failure to a fixed,
      secret-free AppTokenError from None; cover malformed lookup and mint responses
      in direct and CLI tests.
