findings:
  - id: T-AT2-R3
    severity: blocker
    tag: product
    text: >-
      Harm statement: credential exposure. Root cause: the security observer's
      private-hook path has no executable self-check. On Linux, os.spawn
      coverage relies on optional private os._spawnvef, the harness silently
      skips its wrapper when that symbol is absent, and no committed test
      proves the wrapper records a canary. A CPython or Nix change can therefore
      let an installation token enter os.spawn argv while the suite stays
      green. This is a bug that must still be fixed: add one committed
      parametrized observer bite test covering a representative audit-hook
      spawn and os.spawn, assert CredentialObserver.leaks reports both
      canaries, and fail explicitly on the supported Linux environment if the
      private hook is unavailable or not hit.
