findings:
  - id: T-AT1-R2
    severity: debate
    tag: process
    text: >-
      The call-site table lets gate run exit with either success or gate
      failure, and only proves that the agent provider was absent. An early
      failure that never constructs the CI provider can satisfy this leg.
      Stage a passing gate, require exit 0, and require at least one CI-provider
      call; gate evidence correctly remains adapter-free.
  - id: T-AT2-R2
    severity: blocker
    tag: product
    text: >-
      Root cause: incomplete Python process-spawn interception.
      CredentialObserver wraps subprocess.Popen but omits os.system and
      os.posix_spawn variants, so an implementation can put the installation
      token directly in a git/helper command line and pass every observer
      assertion. The consequence is process-list credential exposure despite a
      green security suite, and shell-based credential helpers make this
      materially plausible. Intercept those standard Python APIs and apply the
      existing secret corpus to their command and argv. C-extension writes,
      child-process file writes, and the necessary env/pipe transport may
      remain as the explicitly bounded gaps.
