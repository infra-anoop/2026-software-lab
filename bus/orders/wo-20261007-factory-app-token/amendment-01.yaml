# Orchestrator decision of 2026-10-07 on the phase-1 risk in
# notes/packets/2026-10-07-factory-app-token.handoff.md (worker stop at e5b145d): every CLI
# command gets its GitHub client through the frozen `DEPS.github` provider in cli/common.py,
# which is outside this order's owned paths, so the agent commands cannot switch to the App role.
#
# Decision: one additive CP0 frozen-interface change, approved here.
#   - `factory.cli.common.Deps` gains `agent_github: Callable[[Settings, EnvSettings], GitHubPort]`,
#     defaulting to `factory.github.rest:build_agent_github`. `DEPS.github` is unchanged and stays
#     the CI client (`gate run`, `gate evidence`, board/intent reads).
#   - The agent commands in cli/orders.py (claim, release, handoff, pr open, verdict, bus pr: every
#     one that reads or writes GitHub) use `DEPS.agent_github`.
#   - The shared test fixture (tests/fixtures/cli_runner.py) and the contract tests that substitute
#     `DEPS.github` also substitute `DEPS.agent_github` with the same fake, so existing contract
#     tests keep their meaning. No other provider, field or signature in common.py changes.
# Owned paths and stop conditions are superseded to allow exactly this.
