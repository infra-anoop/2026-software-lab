findings:
  - id: T-AT1
    severity: blocker
    tag: product
    text: >-
      Root cause: provider factories are tested without their CLI call sites.
      Correct builder functions and a claim-only App push can pass while other
      agent commands silently use GITHUB_TOKEN or ambient git credentials, or
      while CI uses the App provider. This is likely because amendment-01 was
      needed for exactly this wiring boundary. Add one table-driven call-site
      contract covering every named agent command, every push entry point, and
      gate run/evidence with distinguishable provider spies.
  - id: T-AT2
    severity: blocker
    tag: product
    text: >-
      Root cause: the leak oracle observes final state rather than
      secret-bearing operations, and its secret corpus is incomplete. A token
      in a deleted temporary helper or non-git child argv, a successful App
      JWT, a different private-key fragment, or an underlying exception
      repr/traceback can escape while tests pass. Credential exposure is a
      material security harm and temporary credential helpers are a plausible
      implementation. Add one shared observer for file writes, process argv,
      output/logs and formatted exception chains, using every token, JWT and
      the complete throwaway key as canaries.
  - id: T-AT3
    severity: debate
    tag: process
    text: >-
      The refresh test uses the real clock and permits a token with two minutes
      left to be sent once despite claiming a margin greater than two minutes.
      Use a fake clock to prove fresh one-hour reuse, advance to the declared
      boundary, and prove refresh before the next authenticated request.
  - id: T-AT4
    severity: nit
    tag: process
    text: >-
      Strength: the smart-HTTP fixture detects ambient-helper fallback on the
      claim path; recorded mode remains exercised; repository installation
      lookup, refused mint, installation 404, exit 4, and the direct CI builder
      token role all have real assertions.
