summary: |
  T036b: in identity.mode = "verified" the agent commands run as the GitHub App. REST goes
  through DEPS.agent_github; git fetch and push authenticate as x-access-token through a
  command-scoped helper that resets ambient helpers and reads the token from its environment.
  The installation comes from GET /repos/{o}/{r}/installation with the App JWT; the token is
  minted in-process and refreshed 5 minutes before expiry. Missing credentials, a refused
  mint, a lookup 404, or a malformed lookup/mint body (R-AT1: fixed AppTokenError from None)
  give exit 4 with no fallback and no response content in the error. gate run and gate
  evidence keep GITHUB_TOKEN. Full suite 1092 passed, 7 xfailed. identity.mode not flipped.
