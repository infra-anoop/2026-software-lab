decision: reject
findings:
  - id: PR-ST1
    severity: blocker
    tag: process
    text: >-
      Root-cause class: incomplete exception normalization at the gate boundary.
      run catches only BusError and GitError, so an invalid-UTF-8 head bus blob
      reproducibly lets UnicodeDecodeError escape instead of returning a failed
      GateResult; a refused NoGitHub write would likewise escape RuntimeError.
      Consequence: contributor-controlled head data can crash the judge and violate
      T102's explicit no-exception fail-closed contract. Likelihood: medium-low
      accidentally but trivial to trigger deliberately. Smallest fix: retain the
      specific handlers, catch unexpected Exception at run, return a generic failed
      result, and add one invalid-UTF-8 regression for the root-cause class.
  - id: PR-ST-L1
    severity: later
    tag: process
    text: >-
      Shared git object reads have no subprocess timeout and bus blobs have no
      size/resource bound before UTF-8 and YAML parsing. A pathological head can
      consume trusted-job time or memory, though it cannot make the gate pass
      falsely and the hosted-job timeout contains it. Fix once in the shared
      git/bus loader during trust-boundary hardening.
