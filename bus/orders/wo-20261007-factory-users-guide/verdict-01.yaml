decision: reject
findings:
  - id: R-UG1
    severity: blocker
    tag: process
    text: >-
      The credentials section falsely says the trusted CI job holds the only token
      allowed to post factory/* results. The Codespace user token and other Actions
      workflows remain technically capable; source pinning only limits which source
      satisfies the required check. Clarify that policy and source pinning are the
      current boundary and keep the known fake-green gap explicit.
  - id: R-UG2
    severity: nit
    tag: process
    text: >-
      The AskQuestion option count and ordering are current kickoff-skill behavior,
      not a contract in the listed canonical sources. Label them as a current Cursor
      convention or remove the implementation detail.
  - id: R-UG3
    severity: nit
    tag: product
    text: >-
      Open question 5 is accurate only for main. The first bus decision request now
      exists on the unmerged retro-additions branch, so qualify the history and ask
      whether that new practice is the expected Wave 1 path.
  - id: R-UG4
    severity: nit
    tag: product
    text: >-
      Recurring I-, FR-, T-, and D-prefixed source ids are unexplained for the
      non-coding governor. Add a one-line legend at first use.
  - id: R-UG5
    severity: nit
    tag: process
    text: >-
      The derived-state section says no file has a hand-maintained done field, but
      that prohibition is scoped to bus records. Qualify the sentence so legitimate
      spec approval fields and task checkboxes are not swept into the claim.
