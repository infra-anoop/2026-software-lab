# FR-037 bootstrap order, reconstructed 2026-10-06 from notes/packets/2026-10-03-factory-v2-p0-contracts.md
# (packet issued in 31b80c4, 2026-10-04T00:07:50Z) on the orchestrator's decision in
# wo-20261006-factory-status-test.amend-03 (same shape as wo-20261004-factory-slice-a/-b).
# P0 was issued as a packet before orders existed and merged in PR #9 (8cd8cb7) with its
# amendments and verdicts but no order file, so main's derived board dropped it. This order is
# added after the amendments and verdicts it governs, on a later branch.
# Known bootstrap distortions (disclosed in the T102 handoff):
#   - size_minutes holds the schema minimum (1); the true size is in `refs`.
#   - the scorecard dates this order's issue from this commit, not the packet date.
#   - no sprint ref: like Slices A and B, refs name the packet only, so sprint-scoped
#     scorecard membership (and the Wave 1 cohort under --sprint) is unchanged.
# `owned_paths` are the packet's before amend-01 (which added the contracts/cli.md JSON
# envelope section and the data-model Lock line); amendments 01-03 supersede them.
# `intents`: I-A3 is the one intent T001-T015 cite; I-M2 is the packet's no-status-fields lock
# (FR-002/003).
# `locks` are the packet's Fidelity table (constitution §I), each with literal tokens P0's code
# carries. Its "Governor locks required" table is context, except cap and horizon, which the
# Fidelity table also names.
# `checks` are the gates the packet's DoD had the worker run by hand as manual equivalents
# (red-first, owned paths, no test-only branching) plus the verdict gates its reviews fall under.
schema_version: 1
kind: order
id: wo-20261003-factory-p0
