  - "FR-037 bootstrap: true size is multi-hour, about 6.5 h wall-clock from the first worker commit (acc6721, 2026-10-04T00:17:23Z) to the accepting verdict (d69d137, 2026-10-04T06:46:44Z), then CI follow-ups to the PR #9 merge (8cd8cb7, 2026-10-04T15:39:11Z); size_minutes holds the schema minimum"
