findings:
  - id: T1
    severity: blocker
    tag: arch
    text: >-
      Frozen GitHubPort writes commit statuses but cannot read them, so lifecycle
      cannot derive accepted from the required factory status contexts.
  - id: T2
    severity: debate
    tag: product
    text: >-
      The declared-lock seed permits lexical token checks and empty letter-token
      lists, weaker than the locked different-tool, different-host, and thinner-behavior promise.
  - id: T3
    severity: debate
    tag: process
    text: >-
      The common --json CLI contract is tested only for status and schema, allowing
      most command groups to omit machine-readable output.
  - id: T4
    severity: later
    tag: arch
    text: >-
      Gate scope pr is required and implemented but remains absent from the
      data-model contract.
  - id: T5
    severity: debate
    tag: product
    text: >-
      The worker invented the governor-facing jargon rejection vocabulary, and the
      mixed seed does not prove that any configured jargon term is detected.
  - id: T6
    severity: nit
    tag: process
    text: >-
      The packet-exact schema command fails from scripts/factory because repository
      config is not discovered; the explicit --repo equivalent passes.
