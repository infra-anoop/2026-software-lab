findings:
  - id: T-B1
    severity: blocker
    tag: process
    text: >-
      Named-lock declaration tests cover tasks and owned paths but not an order
      goal, so goal-only lock discovery can be omitted while the suite passes.
  - id: T-B2
    severity: blocker
    tag: process
    text: >-
      Decision-request lint tests do not cover an existing clean request modified
      to add an id or jargon, allowing an added-files-only scanner to pass.
  - id: T-B3
    severity: blocker
    tag: process
    text: >-
      Deferral tests pin the plan phase only and do not exercise the frozen waived
      sprint-phase pointer rule or reject arbitrary phase pointers.
  - id: T-B4
    severity: debate
    tag: product
    text: >-
      Effective coverage reports 37.5 percent with exit zero and no executable
      boundary enforces the catalog's 90 percent requirement at sprint close.
  - id: T-B5
    severity: debate
    tag: product
    text: >-
      Catalog evidence permits eval ids, but no accepted eval-id syntax or
      authoritative existence source is defined or tested.
  - id: T-B6
    severity: debate
    tag: product
    text: >-
      Tests do not decide whether a planned human mapping or only an existing
      governor judgment counts toward effective coverage.
  - id: T-B7
    severity: nit
    tag: process
    text: >-
      The repository presence smoke hardcodes intent ids from another feature,
      coupling Slice B to unrelated product vocabulary.
  - id: T-B8
    severity: nit
    tag: process
    text: >-
      Strength: all 132 tests are honestly red, both constant-answer probes fail,
      locked fidelity matrices are substantial, and frozen CP0 files are unchanged.
