findings:
  - id: T-B4-1
    severity: blocker
    tag: process
    text: >-
      Root-cause class: overlapping identifier namespaces are tested only as
      disjoint sets. Concrete harm and consequence: an order check whose id
      names both a registered gate and an unlinked catalog row can be discarded
      as a gate id, so catalog-test-linkage passes falsely and handoff can
      proceed while the locked auto-evidence shall remains planned or missing.
      Likelihood: low under today's naming convention but credible because the
      schema permits arbitrary strings in checks and does not make the
      namespaces disjoint; filtering registry ids first greens every current
      checks-kinds test. Smallest sufficient fix: classify catalog membership
      first and add one regression case where a catalog row uses a registered
      gate id with planned evidence and must block naming that row.
