decision: reject
findings:
  - id: PR-B1
    severity: blocker
    tag: process
    text: >-
      Deferral artifact pointers accept any git tree entry, so a tracked
      directory such as scripts satisfies the contract that requires an
      existing file or named phase. This is a fail-open FR-015 bypass.
  - id: PR-B2
    severity: blocker
    tag: process
    text: >-
      The bootstrap gate run passes order_id=None, but PR 22's wo branch causes
      the real Slice C runner to derive wo-20261004-factory-slice-b. Because no
      WorkOrder exists at head, the order gates, catalog linkage and PR linkage
      fail closed; the handoff's vacuous pass is not a real-PR equivalent.
  - id: PR-B3
    severity: blocker
    tag: product
    text: >-
      red-first-proof executes PR-head pytest code with the caller's inherited
      environment. It cannot run in the current Slice C status-writing job under
      D5: head code must execute only in a no-secret read-only evidence job, and
      main-pinned trusted code must validate evidence and publish statuses.
  - id: PR-B4
    severity: later
    tag: process
    text: >-
      The red-first child bootstrap iterates os.environ outside factory.config
      to remove PYTEST variables while inheriting every other environment value.
      Move child environment construction to the typed boundary and pass a
      minimal explicit allowlist.
