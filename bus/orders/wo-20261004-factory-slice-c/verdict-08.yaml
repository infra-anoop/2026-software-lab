findings:
  - id: PR-C2-L1
    severity: later
    tag: process
    text: >-
      Bind the evidence bundle's full base_sha to the trusted run. The judge
      currently validates its shape but not equality with the base it judges.
      Wave 1 remains explicitly self-reported and the independent T-star run is
      the proof of record, so this is hardening for the Wave 1 retro.
  - id: PR-C2-L2
    severity: later
    tag: process
    text: >-
      Prove in the workflow oracle that the evidence producer executable comes
      from the intended checkout. This adds contract precision rather than
      authority to the explicitly self-reported Wave 1 bundle.
  - id: PR-C2-L3
    severity: later
    tag: process
    text: >-
      Normalize exit-zero malformed or non-JSON output from the Nix hook
      fallback to the hook's quiet fail-open JSON. Hooks are advisory and CI is
      authoritative, so the degraded response is not blocking.
  - id: PR-C2-L4
    severity: later
    tag: process
    text: >-
      The workflow secrets-context detector catches secrets.NAME but not valid
      indexed expressions such as secrets['NAME'] or whitespace variants. The
      current read-only evidence workflow has no secret reference, so extend
      the detector and its self-check table as future trust-boundary hardening.
