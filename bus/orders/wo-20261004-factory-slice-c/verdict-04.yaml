decision: reject
findings:
  - id: PR-C1
    severity: blocker
    tag: product
    text: >-
      The pull_request workflow gives statuses:write and GITHUB_TOKEN to code
      checked out from the PR head, then executes that code. A same-repository PR can
      steal the token or post arbitrary successful factory statuses, defeating the
      authority those statuses are meant to provide.
  - id: PR-C2
    severity: blocker
    tag: process
    text: >-
      In a fresh worktree with no project venv, factory-hook.sh executes ambient uv.
      This repository provides uv only through Nix, so all hooks exit 127 before their
      documented quiet fail-open handler can run.
  - id: PR-C3
    severity: blocker
    tag: product
    text: >-
      factory-status-test is a registered P1 gate but its
      factory.gates.repo.status_test:run entrypoint does not exist in any slice. The
      authoritative runner and check registry therefore remain fail-closed after A/B.
  - id: PR-C4
    severity: blocker
    tag: process
    text: >-
      The PR mutates the Slice C packet Status even though that packet is absent from
      the original and amended owned paths. Revert the out-of-scope bookkeeping edit.
  - id: PR-C5
    severity: later
    tag: process
    text: >-
      The authoritative factory-tests job still excludes every contract and seed test.
      Remove the CP1 bootstrap selector after A and B merge, before C lands.
  - id: PR-C6
    severity: later
    tag: process
    text: >-
      branch-protection-require-pr is registered fail-closed while its required T066
      deploy/github/branch-protection.json snapshot is absent, so C remains red until
      that explicit ops dependency is completed or registration is staged.
