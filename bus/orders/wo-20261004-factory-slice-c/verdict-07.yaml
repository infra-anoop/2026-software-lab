findings:
  - id: T-C4-1
    severity: blocker
    tag: product
    text: >-
      Root-cause class: the privileged-shell policy is a partial denylist
      rather than a fail-closed executable allowlist. Harm: head_code_reason
      accepts env bash -c, command bash -c, and git -C checkout forms that can
      check out and execute the PR head in the trusted job holding
      GITHUB_TOKEN and statuses:write. Consequence: a same-repository PR can
      expose the credential or forge successful factory/* statuses, breaking
      the letter locks D5, FR-022a and PR-C1. Likelihood: medium because these
      wrappers and git global options are ordinary workflow spellings.
      Smallest fix: allowlist the exact trusted commands/actions and permitted
      arguments, recursively rejecting wrappers and nested shells, with one
      regression table for this root-cause class.
  - id: T-C4-2
    severity: later
    tag: process
    text: >-
      The fail-closed bundle matrix rejects a wrong head_sha but does not bind
      a wrong full-length base_sha. Wave 1 remains explicitly self-reported and
      the independent T-star run is the proof of record, so harden this later.
  - id: T-C4-3
    severity: later
    tag: process
    text: >-
      The evidence workflow requires one factory gate evidence call but does
      not prove that producer executable comes from a separate main checkout.
      D7 already labels Wave 1 self-reported, so this is contract precision
      rather than additional trusted authority.
  - id: T-C4-4
    severity: later
    tag: process
    text: >-
      The hook-wrapper tests do not cover an exit-zero malformed or non-JSON
      answer from the Nix fallback. Hooks are advisory and fail open, so
      normalize this degraded case after the locked trust-boundary defect.
