prompt: >
  Why this is asked: you proposed three separate backlogs (product, infrastructure, tooling) and
  that each future sprint picks up work of one type only, because mixing product and tooling made
  it feel like the real work was stuck.
  Option A, one type per sprint, strictly: a sprint takes items from one backlog only and uses
  nothing from the others.
  Option B, one primary type, with real work as the test bench: a sprint takes items from one
  backlog only, but a tooling sprint is judged by running a small piece of real product work on
  the improved factory. That product work tests the tooling; it is not product backlog work.
  Option B guards against tooling built without a real customer, which is the drift you sensed in
  Wave 1.
  Not blocking: answer after we finish discussing direction in chat.
  What happens next: the orchestrator records the choice in the harness-change register.
options:
  - label: "A: One type per sprint, strictly"
  - label: "B: One primary type, with real product work as the test bench"
recommended: "B: One primary type, with real product work as the test bench"
