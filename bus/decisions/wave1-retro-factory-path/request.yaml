owner: governor
feature: 001-factory-v2
blocking: false
prompt: >
  Why this is asked: you asked us to decide the fork in the road consciously: restart on a bought
  product, a hybrid, or keep building what Wave 1 made. A fresh reviewer from a different model
  family surveyed the options against the criteria you agreed and recommends a hybrid.
  Option A, Spec Kit as the engine: upgrade the Spec Kit already in the repo and use its workflow
  engine to run the whole flow, with our culture (intent, decisions, independent review policy)
  added as a layer on top. GitHub Issues hold the work, one issue per order, its tasks inside.
  Plain GitHub Actions start and resume runs, so your laptop is not needed. Cursor builds; reviews
  run on another model family (first tried as a pinned model in Cursor or Copilot, before adding
  any new tool). Wave 1's own job queue, command and most checks are retired step by step;
  decisions and review records stay. First tried on one real order. Scored 33 of 40.
  Option B, AI-SDLC behind Spec Kit: a newer open-source framework with the broadest coverage and
  the best cost controls, but it started in February 2026, its unattended mode is still
  experimental, and it brings a second set of rules to reconcile with ours. Scored 28 of 40.
  Option C, keep building on Wave 1: it works today, but it can only run Cursor (it fails the
  rule that the engine must run two agent tools), and every part stays ours to maintain.
  The case against A: Spec Kit's engine has no built-in watchdog, deadlines, restarts or cost cap,
  so that glue is ours and could grow back into a homemade factory. The survey's guard: if the
  trial on one real order shows more than a few days of such glue, switch to B.
  Not blocking: answer after reading the survey summary (first section of the survey file).
  What happens next: the choice shapes the Wave 1.5 scope, which comes to you as a plan for
  approval before any work starts.
options:
  - label: "A: Spec Kit as the engine, GitHub Issues for work, tried on one real order first"
  - label: "B: AI-SDLC behind Spec Kit"
  - label: "C: Keep building on Wave 1"
recommended: "A: Spec Kit as the engine, GitHub Issues for work, tried on one real order first"
