chosen: "A: Copilot and Cursor behind a per-role switch from day one; chunk size a factory requirement on plan and tasks; on overrun retry once, then park and continue, the sprint manager handling parked tasks"
governor_minutes: 15
notes: >
  The governor directed, in the architect's chat at about 10:16 PT on 2026-10-21: design Copilot in
  from day one at the infrastructure level, controlled at first by one setting such as AI_ENV=cursor,
  because keeping both open will probably give the best experience; the 30-minute chunk is a
  requirement input from the factory to the Spec Kit plan, the reviewer reviews it, and a piece
  aborted on the one-hour limit goes to the sprint manager's exception paths, including breaking it
  up or escalating to him. He also stated that the session is gathering decisions, not implementing.
  The architect's refinements, which the governor confirmed at 10:20 PT ("Yes. They do."): the
  switch is per role with a default; it selects Copilot's command-line agent in the lab's own
  Actions job; one allowed-commands policy generated into each tool's format; the estimate lives in
  the task list with a warning-first check; each chunk leaves the code working; every step is a
  chunk; time used is reported against the estimate; on overrun, retry once, then park and continue,
  with the sprint manager handling parked tasks in the morning. Recorded by the architect in the
  reliability report, section 9, items 4 to 6.
