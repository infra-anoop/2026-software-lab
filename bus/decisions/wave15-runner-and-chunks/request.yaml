prompt: >
  Why this is asked: with GitHub Actions as the baseline host for unattended work, three design
  points follow. Which agent runs each step: Cursor only, or Cursor and Copilot behind a switch from
  day one. Where the 30-minute chunk size is enforced: left to the builder, or a factory requirement
  on Spec Kit's plan and task list, judged by the reviewer. What happens when a chunk overruns the
  60-minute limit at night, when no one is watching. Settled in open conversation on 2026-10-21, not
  by a form; the governor proposed the first two and agreed the architect's refinements.
options:
  - label: "A: Copilot and Cursor behind a per-role switch from day one; chunk size a factory requirement on plan and tasks; on overrun retry once, then park and continue, the sprint manager handling parked tasks"
  - label: "B: Cursor only for now; chunk size left to the builder; a stopped chain waits for the morning"
recommended: "A: Copilot and Cursor behind a per-role switch from day one; chunk size a factory requirement on plan and tasks; on overrun retry once, then park and continue, the sprint manager handling parked tasks"
