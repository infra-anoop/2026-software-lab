prompt: >
  Why this is asked: you chose to run Wave 1.5 with two standing sessions, this one as coach and
  chief architect and a separate one managing the sprint. That raises how you talk to them.
  Option A, one front door: you converse only with the coach. The sprint session reaches you only
  through decision requests and status updates in git, which the coach can read and explain. You
  keep one picture of everything; sprint questions take one extra step.
  Option B, two conversations: you also talk to the sprint session directly during Wave 1.5.
  Sprint questions are answered faster, but your picture is split across two chats, and the two
  sessions can give you different accounts.
  Either way it is an experiment, reviewed at the next retro.
  Not blocking: the retro continues while this is open.
  What happens next: the orchestrator records the choice in the harness-change register and in
  the brief for the sprint session.
options:
  - label: "A: One front door: talk only to the coach"
  - label: "B: Two conversations: also talk to the sprint session directly"
recommended: "A: One front door: talk only to the coach"
